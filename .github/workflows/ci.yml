name: App Data Model Browser CI
# Every dependency resolves without credentials (style-package went public on 2026-10-08), so
# no HDS_CI_TOKEN guard. All five steps below (npm ci, lint, typecheck, test, build) were run
# on a clean clone with an empty HOME, no SSH key or agent and no git config before this
# workflow was added; none is left out. Network note: backloop.dev's postinstall may fetch the
# public certificate from https://backloop.dev/public/; the vite plugin no longer does (it is only
# loaded for the dev server, not for vitest or builds: B-2026-10-08-10).

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Test
      run: npm test

    - name: Build
      run: npm run build
